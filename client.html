<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>ЭКСПЕРТ — просмотр сметы</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#111417;color:#f4f4f4}
*{box-sizing:border-box}body{margin:0}
.top{background:#1b2025;border-bottom:1px solid #323b43;padding:14px 16px;display:flex;align-items:center;gap:10px}
.mark{background:#a54d56;height:38px;width:4px;border-radius:3px}
.name{font-size:23px;line-height:1.1;font-weight:790;letter-spacing:.01em}
.tagline{font-size:12px;color:#aab4bc;margin-top:4px}
main{max-width:900px;margin:0 auto;padding:14px 12px 42px}
#loading{margin:12px 0 20px;padding:15px;border:1px solid #344049;border-radius:13px;background:#20262b;color:#d2d9df;font-size:14px;line-height:1.5}
#loading[hidden]{display:none}
.meter{background:#323d45;height:4px;border-radius:3px;margin-top:11px;overflow:hidden}
.meter>div{height:100%;width:0%;background:#b75c66;transition:width .15s}
#loading.error{border-color:#82474c;color:#f3c7cb}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.tools[hidden]{display:none}
.pager{font-size:13px;color:#b4bec7}
.zoom{display:flex;gap:8px;align-items:center;color:#dbe2e8;font-size:14px;font-variant-numeric:tabular-nums}
button{border:0;border-radius:9px;background:#343e46;color:#fff;min-width:40px;min-height:38px;font-size:20px;font-weight:650}
button:disabled{opacity:.45}
#pages{display:grid;gap:13px;overflow-x:auto;justify-items:start}
.paper{background:white;border-radius:5px;overflow:hidden;padding:5px;box-shadow:0 5px 16px #0005;width:max-content}
.paper canvas{display:block;max-width:none;width:auto;height:auto}
.pageNumber{color:#53616b;background:#fff;text-align:center;padding:6px 0 3px;font-size:12px}
footer{max-width:900px;margin:10px auto 0;color:#89969f;font-size:11px;padding:0 16px 24px;line-height:1.55}

/* Adaptive reading view is derived locally from the SAME immutable PDF. */
[hidden]{display:none!important}
.mode-tools{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0 14px}
.mode-tools button{font-size:13px;font-weight:750;padding:9px 13px;min-width:0;min-height:40px;background:#293943}
.mode-tools button.active{background:#b04e5a;color:#fff}
#mobileRoot{max-width:820px;margin:0 auto 18px;color:#17232d}
.m-estimate{background:#fff;border-radius:9px;padding:20px 17px 24px;box-shadow:0 7px 28px #0002;overflow-wrap:anywhere}
.m-estimate:before{content:"";display:block;background:linear-gradient(90deg,#cf2c3a 14%,#172734 14%);height:4px;margin:-20px -17px 18px}
.m-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#60717d;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.055em}
.m-meta time{color:#bd4353}.m-banner{display:block;width:100%;height:auto;border-radius:8px;margin:18px 0 14px;background:#081219}
.m-estimate h1{font-size:23px;line-height:1.17;margin:14px 0 7px;letter-spacing:-.025em}
.m-desc{font-size:13px;color:#6a7a84;margin:0 0 18px}
.m-car{display:flex;gap:12px;align-items:flex-start;border:1px solid #dae3e8;border-radius:10px;background:#f5f8f9;padding:14px}
.m-car-details{min-width:0;flex:1}.m-eyebrow{font-size:10px;color:#b64d59;font-weight:800;letter-spacing:.08em}
.m-car h2{font-size:19px;line-height:1.25;margin:7px 0 13px}
.m-car p{font-size:13px;line-height:1.38;margin:6px 0;color:#263643}
.m-car .m-muted{color:#647884;font-size:11px;margin-top:14px}
.m-photo{width:37%;max-width:170px;aspect-ratio:1/1;object-fit:cover;border-radius:8px;cursor:zoom-in}
.m-photo.m-photo-large{position:fixed;inset:0;margin:auto;z-index:100;width:auto;max-width:95vw;max-height:85vh;aspect-ratio:auto;object-fit:contain;box-shadow:0 0 0 120vmax #000d;cursor:zoom-out}
.m-section{font-size:18px;margin:24px 0 11px;line-height:1.25}
.m-works{width:100%;border-collapse:collapse;font-size:13px}
.m-works th{background:#edf2f4;color:#586d7a;font-size:10px;text-align:left;text-transform:uppercase;padding:10px 9px}
.m-works th:last-child,.m-works td:last-child{text-align:right;width:29%;white-space:nowrap}
.m-works td{padding:12px 9px;line-height:1.4;border-bottom:1px solid #dde5e8;vertical-align:top}
.m-works tr:nth-child(even){background:#f1f5f7}
.m-total{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:#15252f;border-radius:8px;padding:15px 13px;color:#fff;margin:15px 0 20px}
.m-total span{font-size:12px}.m-total strong{font-size:23px;white-space:nowrap}
.m-clause{border-top:1px solid #dfe5e9;padding:12px 3px}
.m-clause h3{font-size:14px;line-height:1.38;margin:0 0 7px}
.m-clause h3:before{content:"•";color:#c94c5a;margin-right:9px}
.m-clause p{font-size:13px;line-height:1.61;color:#314653;margin:0}
.m-foot{border-top:1px solid #dfe5e9;padding-top:14px;margin-top:18px;color:#617380;font-size:11px}
.m-downloadbar{display:flex;justify-content:flex-end;margin:0 0 12px}
.m-download{display:inline-block;text-decoration:none;background:#293943;color:white;font-size:12px;font-weight:700;padding:10px 12px;border-radius:9px}
@media(min-width:650px){.m-estimate{padding:35px 42px}.m-estimate:before{margin:-35px -42px 22px}.m-estimate h1{font-size:28px}.m-car h2{font-size:23px}.m-works{font-size:15px}.m-clause p{font-size:15px}}
</style>
</head>
<body>
<header class="top"><span class="mark" aria-hidden="true"></span><div><div class="name">ЭКСПЕРТ</div><div class="tagline">Кузовной сервис · просмотр сметы</div></div></header>
<main>
<div id="loading" role="status" aria-live="polite">Открываем смету…<div class="meter"><div id="bar"></div></div></div>
<div id="modeTools" class="mode-tools" hidden>
  <button id="mode-mobile" class="active" type="button" aria-label="Крупный мобильный просмотр">Удобный вид</button>
  <button id="mode-pdf" type="button" aria-label="Печатные страницы PDF">PDF</button>
</div>
<div id="mobileRoot" hidden></div>
<div id="tools" class="tools" hidden><div id="count" class="pager"></div><div class="zoom"><button id="minus" aria-label="Уменьшить масштаб">−</button><span id="zoom">100%</span><button id="plus" aria-label="Увеличить масштаб">+</button></div></div>
<div id="pages"></div>
</main>

<script type="module">
const TEST_URL="https://storage.yandexcloud.net/kuzovpro-pdf-test-84/KuzovPRO_large_test_6.2MB.pdf";
const CDN="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/";
const q=id=>document.getElementById(id);
let pdf=null,zoom=1,running=false,hasMobile=false;
function status(s,error=false){const box=q("loading");box.hidden=false;box.classList.toggle("error",error);box.firstChild.textContent=s}
function pct(n){q("bar").style.width=Math.max(0,Math.min(100,Math.round(n*100)))+"%"}
function urlFromQuery(){
  // Demo is the sole published test file. In production, the app creates 128-bit random IDs.
  const fragment=decodeURIComponent(location.hash.slice(1));
  if(fragment==="demo")return TEST_URL;
  const match=/^id=([0-9a-f]{32})$/.exec(fragment);
  if(!match)throw Error("Некорректная ссылка на смету. Для проверки откройте тестовый адрес #demo.");
  return "https://storage.yandexcloud.net/kuzovpro-pdf-test-84/estimates/"+match[1]+".pdf";
}
async function fetchFile(url){
  const r=await fetch(url,{mode:"cors",cache:"no-store"});
  if(!r.ok)throw Error("Не удалось получить документ (HTTP "+r.status+")");
  const max=40*1048576;
  const known=Number(r.headers.get("content-length")||0);
  if(known>max)throw Error("Документ слишком большой для этого теста");
  if(!r.body){
    const bytes=new Uint8Array(await r.arrayBuffer());
    if(bytes.length>max)throw Error("Документ слишком большой");
    pct(1);return bytes;
  }
  let total=0;const chunks=[],reader=r.body.getReader();
  while(true){
    const x=await reader.read();if(x.done)break;
    total+=x.value.byteLength;
    if(total>max){await reader.cancel();throw Error("Документ слишком большой")}
    chunks.push(x.value);
    if(known)pct(Math.min(.95,total/known));
    status("Загружаем документ… "+(total/1048576).toFixed(1)+" МиБ");
  }
  const bytes=new Uint8Array(total);let at=0;
  for(const chunk of chunks){bytes.set(chunk,at);at+=chunk.length}
  pct(1);return bytes;
}
async function render(){
  if(!pdf)return;
  const host=q("pages");host.replaceChildren();
  q("tools").hidden=false;
  q("zoom").textContent=Math.round(zoom*100)+"%";
  q("count").textContent="Страниц: "+pdf.numPages;
  const availableWidth=Math.min(880,Math.max(280,host.clientWidth-12));
  const pixelBudget=Math.min(4_000_000,24_000_000/pdf.numPages);
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n);
    const initial=page.getViewport({scale:1});
    const view=page.getViewport({scale:zoom*availableWidth/initial.width});
    const ratio=Math.min(window.devicePixelRatio||1,2.6,
      Math.sqrt(pixelBudget/(view.width*view.height)));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(view.width*ratio);canvas.height=Math.round(view.height*ratio);canvas.style.width=Math.round(view.width)+"px";canvas.style.height=Math.round(view.height)+"px";
    const context=canvas.getContext("2d",{alpha:false});
    if(!context)throw Error("Отображение PDF недоступно");
    const paper=document.createElement("div");paper.className="paper";
    const label=document.createElement("div");label.className="pageNumber";label.textContent=n+" / "+pdf.numPages;
    paper.append(canvas,label);host.append(paper);
    await page.render({canvas,canvasContext:context,viewport:view,transform:[ratio,0,0,ratio,0,0]}).promise;
  }
}
async function start(){
  if(running)return;running=true;
  try{
    const url=urlFromQuery();
    status("Получаем PDF…");
    const data=await fetchFile(url);
    if(data.length<5||String.fromCharCode(...data.slice(0,5))!=="%PDF-")throw Error("Полученный документ не PDF");
    const pdfjs=await import(CDN+"pdf.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc=CDN+"pdf.worker.mjs";
    status("Подготавливаем страницы…");
    pdf=await pdfjs.getDocument({data}).promise;
    // Try a complete local PDF -> mobile HTML projection first. Legacy or unknown
    // layouts are always shown in their original PDF form (no partial estimate).
    hasMobile=false;
    try {
      const {buildMobileEstimate}=await import("./mobile-reflow.mjs");
      hasMobile=await buildMobileEstimate(pdf,q("mobileRoot"),url);
    } catch(_) { hasMobile=false; }
    q("modeTools").hidden=!hasMobile;
    if(hasMobile){
      q("mobileRoot").hidden=false;q("pages").hidden=true;q("tools").hidden=true;
      q("mode-mobile").classList.add("active");q("mode-pdf").classList.remove("active");
    } else {
      q("mobileRoot").hidden=true;q("pages").hidden=false;
      await render();
    }
    q("loading").hidden=true;
  }catch(e){status("Не удалось открыть смету: "+(e?.message||String(e)),true)}
  finally{running=false}
}
q("mode-mobile").addEventListener("click",()=>{
  if(!hasMobile)return;
  q("mobileRoot").hidden=false;q("pages").hidden=true;q("tools").hidden=true;
  q("mode-mobile").classList.add("active");q("mode-pdf").classList.remove("active");
});
q("mode-pdf").addEventListener("click",async()=>{
  if(!pdf)return;
  q("mobileRoot").hidden=true;q("pages").hidden=false;
  q("mode-mobile").classList.remove("active");q("mode-pdf").classList.add("active");
  if(!q("pages").children.length)await render();
  else q("tools").hidden=false;
});
q("plus").addEventListener("click",async()=>{
  if(running||zoom>=1.8||!pdf)return;
  running=true;
  try{zoom=Math.min(1.8,Math.round((zoom+.2)*10)/10);await render()}
  finally{running=false}
});
q("minus").addEventListener("click",async()=>{
  if(running||zoom<=.6||!pdf)return;
  running=true;
  try{zoom=Math.max(.6,Math.round((zoom-.2)*10)/10);await render()}
  finally{running=false}
});
start();
</script>
</body></html>
